---
- name: Install and Configure Prometheus Node Exporter
  hosts: all
  become: true
  vars:
    node_exporter_version: "1.8.2"
    node_exporter_arch: "amd64"

  tasks:
    - name: Ensure group and user "node_exporter" exist
      ansible.builtin.group:
        name: node_exporter
        system: true
    - ansible.builtin.user:
        name: node_exporter
        group: node_exporter
        shell: /sbin/nologin
        create_home: false
        system: true

    - name: Download and unarchive Node Exporter binary
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: '0644'
    - ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: "/tmp"
        remote_src: true

    - name: Install binary to /usr/local/bin and configure systemd
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: node_exporter
        group: node_exporter
        mode: '0755'
      notify: Restart node_exporter

    - ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target
          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Enable service and clean up temporary files
      ansible.builtin.systemd_service:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true
    - ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd_service:
        name: node_exporter
        state: restarted
        daemon_reload: true

