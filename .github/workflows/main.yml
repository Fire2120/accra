
name: Ansible Playbook Validation

on:
  push:
    branches:
      - main
    paths:
      - 'accra/**'
      - '.github/workflows/ansible-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'accra/**'
      - '.github/workflows/ansible-check.yml'
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: [self-hosted, linux, rhel10]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Ansible version
        run: ansible --version

      - name: Check all playbooks
        shell: bash
        run: |
          set -euo pipefail

          find accra -type f \( -name "*.yml" -o -name "*.yaml" \) -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            ansible-playbook --syntax-check "$file"
          done
